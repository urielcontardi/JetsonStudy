<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>orwell</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0d0d0d; color: #b0b0b0; font-family: monospace; font-size: 13px; display: flex; flex-direction: column; }

#statusbar {
  display: flex; align-items: stretch; flex-shrink: 0;
  height: 34px; background: #111; border-bottom: 1px solid #1e1e1e;
  position: sticky; top: 0; z-index: 10;
}
.s-item { display: flex; align-items: center; padding: 0 12px; border-right: 1px solid #1e1e1e; white-space: nowrap; }
#s-host  { color: #555; }
#s-rec   { font-weight: bold; }
#s-rec.on  { color: #4caf50; }
#s-rec.off { color: #444; }
#s-disk  { color: #777; }
#s-event { color: #555; }
.s-gap   { flex: 1; }
nav { display: flex; }
nav a { display: flex; align-items: center; padding: 0 14px; color: #3a3a3a; text-decoration: none; border-left: 1px solid #1e1e1e; font-size: 12px; }
nav a:hover  { color: #888; background: #161616; }
nav a.active { color: #c8c8c8; border-bottom: 2px solid #4caf50; }

#preview-wrap {
  flex: 1; min-height: 0; background: #000;
}
#preview-frame { width: 100%; height: 100%; border: none; display: block; }

#clip-bar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px; background: #111; border-top: 1px solid #1e1e1e;
}
.ts-wrap { display: flex; align-items: center; gap: 6px; }
.ts-lbl  { color: #444; }
.ts-in {
  background: #0d0d0d; border: 1px solid #252525; color: #999;
  padding: 3px 7px; font-family: monospace; font-size: 12px; width: 178px;
}
.ts-in:focus { outline: none; border-color: #4caf50; color: #c8c8c8; }
#dl-dur { color: #444; font-size: 12px; min-width: 44px; }
#btn-dl {
  margin-left: auto; padding: 4px 16px;
  background: #4caf50; color: #0a0a0a;
  border: none; font-family: monospace; font-size: 13px; font-weight: bold;
  cursor: pointer; text-decoration: none; display: inline-block;
}
#btn-dl:hover { background: #66bb6a; }
#btn-dl.off   { background: #1a1a1a; color: #333; pointer-events: none; }
</style>
</head>
<body>

<div id="statusbar">
  <span class="s-item" id="s-host">—</span>
  <span class="s-item" id="s-rec" class="off">○ idle</span>
  <span class="s-item" id="s-cam">cam0</span>
  <span class="s-item" id="s-disk">—</span>
  <span class="s-item" id="s-event">—</span>
  <span class="s-gap"></span>
  <nav>
    <a href="/" class="tab">live</a>
    <a href="/config" class="tab">config</a>
    <a href="/docs" class="tab">docs</a>
  </nav>
</div>

<div id="preview-wrap">
  <iframe id="preview-frame" allowfullscreen></iframe>
</div>

<div id="clip-bar">
  <div class="ts-wrap">
    <span class="ts-lbl">início</span>
    <input class="ts-in" id="in-s" type="text" spellcheck="false">
  </div>
  <div class="ts-wrap">
    <span class="ts-lbl">fim</span>
    <input class="ts-in" id="in-e" type="text" spellcheck="false">
  </div>
  <span id="dl-dur"></span>
  <a id="btn-dl" class="off" href="#" download>↓ baixar clipe</a>
</div>

<script>
const CLIP_API = "/api";
const PREVIEW_BASE = "/preview";
const CAM = '0';
let S = null, E = null;
const iso   = ts => new Date(ts * 1000).toISOString().replace('.000', '');
const epoch = s  => Date.parse(s) / 1000;

const inS   = document.getElementById('in-s');
const inE   = document.getElementById('in-e');
const btnDl = document.getElementById('btn-dl');
const dlDur = document.getElementById('dl-dur');

function updateDl() {
  if (!S || !E || E <= S) {
    btnDl.className = 'off'; btnDl.href = '#'; dlDur.textContent = '';
    return;
  }
  btnDl.className = '';
  btnDl.href = `${CLIP_API}/clips?camera=${CAM}&start=${iso(S)}&end=${iso(E)}`;
  const dur = Math.round(E - S);
  dlDur.textContent = dur >= 60 ? `${Math.floor(dur/60)}m${dur%60}s` : `${dur}s`;
}

function setSel(s, e) {
  S = s; E = e;
  inS.value = iso(S);
  inE.value = iso(E);
  updateDl();
}

async function loadRange() {
  try {
    const r = await fetch(`${CLIP_API}/range?camera=${CAM}`);
    if (!r.ok) return;
    const d = await r.json();
    if (!d.first || !d.last) return;
    const t1 = epoch(d.last);
    const t0 = epoch(d.first);
    if (!S) setSel(Math.max(t0, t1 - 60), t1);
  } catch {}
}
loadRange();
setInterval(loadRange, 30000);

inS.addEventListener('change', () => { const ts = epoch(inS.value); if (!isNaN(ts)) { S = ts; updateDl(); } });
inE.addEventListener('change', () => { const ts = epoch(inE.value); if (!isNaN(ts)) { E = ts; updateDl(); } });
btnDl.addEventListener('click', e => {
  if (btnDl.classList.contains('off')) { e.preventDefault(); return; }
  dlDur.textContent = 'gerando…';
  setTimeout(updateDl, 3000);
});

// preview: bate direto na porta 8888 do MediaMTX, sem passar pelo nginx proxy
document.getElementById('preview-frame').src = `${PREVIEW_BASE}/cam0`;

// status bar
document.getElementById('s-host').textContent = location.hostname;
document.querySelectorAll('.tab').forEach(t => { if (t.getAttribute('href') === location.pathname) t.classList.add('active'); });

async function pollMetrics() {
  try {
    const r = await fetch(`${CLIP_API}/metrics`); if (!r.ok) return;
    const m = await r.json();
    const el = document.getElementById('s-rec');
    el.textContent = m.recording ? '● REC' : '○ idle';
    el.className   = m.recording ? 'on' : 'off';
    const gb = n => (n / 1e9).toFixed(0);
    document.getElementById('s-disk').textContent = `${gb(m.disk_used_bytes)} GB / ${gb(m.disk_total_bytes)} GB`;
    if (m.last_event_ts) {
      const d = new Date(m.last_event_ts * 1000);
      const t = d.getUTCHours().toString().padStart(2,'0') + 'h' + d.getUTCMinutes().toString().padStart(2,'0');
      document.getElementById('s-event').textContent = `último: ${t}${m.last_event_label ? ' ' + m.last_event_label : ''}`;
    }
  } catch {}
}
pollMetrics(); setInterval(pollMetrics, 10000);
</script>
</body>
</html>
