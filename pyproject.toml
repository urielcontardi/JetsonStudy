[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orwell-shared"
version = "0.1.0"
requires-python = ">=3.10"   # JetPack 6 traz Python 3.10 (imagem L4T do recorder)
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
clip-api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
where = ["shared"]
include = ["orwell_shared*"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "services", "tests"]
pythonpath = ["shared", "services/clip-api", "services/recorder"]
addopts = "--import-mode=importlib"
