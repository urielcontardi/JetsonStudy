device_name: orwell-01

cameras:
  - id: "0"
    argus_sensor_id: 0
    name: front
  - id: "1"
    argus_sensor_id: 1
    name: rear

capture:
  width: 1920
  height: 1080
  fps: 25
  codec: h264
  encoder: hw              # NVENC — Orin NX
  gop_seconds: 1.0
  segment_seconds: 4.0
  bitrate_kbps: 500        # arquivo direto desde o início (~20 dias de retenção)

ai:
  enabled: false           # true quando modelo TRT disponível em /models/detector.engine
  inference_fps: 8
  confidence_threshold: 0.6
  input_width: 640
  input_height: 360
  model_path: /models/detector.engine

event_buffer:
  enabled: true
  buffer_seconds: 60
  bitrate_kbps: 8000       # alta qualidade para o clip de evento
  tmpfs_dir: /dev/shm/orwell

retention:
  data_dir: /var/lib/orwell/data
  events_dir: /var/lib/orwell/events
  disk_high_watermark_pct: 85   # era 50

preview:
  enabled: true
  rtsp_base_url: rtsp://preview:8554

conveyor:
  enabled: true
  host: conveyor.tractian.com
  port: 8080
  gateway_ext_id: "000011113333"   # gateway virtual compartilhado (mesmo do iot-emulator)
  # sensor_ext_id: ""              # deixar vazio = auto-derivado de blake3(eMMC CID)
  #                                # ver deploy/85-conveyor-register.sh
  upload_interval_s: 30
  status_interval_s: 300
