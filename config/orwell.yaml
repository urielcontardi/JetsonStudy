device_name: orwell-01
cameras:
  - id: "0"
    argus_sensor_id: 0
    name: front
  - id: "1"
    argus_sensor_id: 1
    name: rear
capture:
  width: 1920
  height: 1080
  fps: 30
  codec: h265            # h264 | h265
  encoder: hw            # hw (NVENC, Orin NX) | sw (x264enc, fallback Nano)
  gop_seconds: 1.0
  segment_seconds: 4.0   # fácil de mudar (ADR-0006)
  bitrate_kbps: 8000
ai:
  enabled: false         # Fase 1 = false; Fase 2 liga nvinfer/nvtracker
preview:
  enabled: false         # ferramenta de dev (RTSP/WebRTC via MediaMTX)
  rtsp_base_url: rtsp://preview:8554
retention:
  data_dir: /var/lib/orwell/data
  disk_high_watermark_pct: 85
broker:
  host: broker
  port: 1883
  events_topic: orwell/events
cloud:
  backend: s3
  bucket: ""                # preencher quando definir a nuvem (ADR-0010)
  prefix: orwell/
