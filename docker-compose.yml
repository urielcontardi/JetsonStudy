services:
  clip-api:
    build:
      context: .
      dockerfile: services/clip-api/Dockerfile
    restart: unless-stopped
    environment:
      ORWELL_INDEX_DB: /data/index.sqlite
      ORWELL_DATA_DIR: /data
    volumes:
      - ${ORWELL_DATA_DIR:-./data}:/data
    ports:
      - "8080:8080"

  # ── recorder: SÓ no Jetson (precisa de GStreamer/NVIDIA + câmeras GMSL). ──
  # Suba com:  docker compose --profile jetson up -d
  recorder:
    profiles: ["jetson"]
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    restart: unless-stopped
    runtime: nvidia               # NVIDIA Container Runtime
    privileged: true              # acesso às câmeras GMSL/Argus
    ipc: host
    environment:
      ORWELL_CONFIG: /app/config/orwell.yaml
      ORWELL_INDEX_DB: /data/index.sqlite
      ORWELL_RETENTION__DATA_DIR: /data
    volumes:
      - ${ORWELL_DATA_DIR:-./data}:/data
      - ./config:/app/config:ro
      - /tmp/argus_socket:/tmp/argus_socket   # daemon Argus do host
    devices:
      - /dev/video0:/dev/video0
      # adicione mais conforme as câmeras: /dev/video1, etc.

  # ── preview: SÓ em dev. Live view (RTSP/WebRTC) das câmeras via MediaMTX. ──
  # Suba com:  docker compose --profile dev up -d preview
  # No Mac (via Tailscale):  VLC -> rtsp://orwell-nx:8554/cam0  |  WebRTC -> http://orwell-nx:8889/cam0
  preview:
    profiles: ["dev"]
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8889:8889"
