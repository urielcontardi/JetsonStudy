services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      dashboard:
        condition: service_healthy
      clip-api:
        condition: service_healthy
      preview:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  clip-api:
    build:
      context: .
      dockerfile: services/clip-api/Dockerfile
    restart: unless-stopped
    environment:
      ORWELL_INDEX_DB: /data/index.sqlite
      ORWELL_DATA_DIR: /data
      ORWELL_EVENTS_DIR: /events
      ORWELL_CONFIG: /app/config/orwell.yaml
    volumes:
      - ${ORWELL_DATA_DIR:-./data}:/data
      - ${ORWELL_EVENTS_DIR:-./events}:/events:ro
      - ./config:/app/config
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  uploader:
    build:
      context: .
      dockerfile: services/uploader/Dockerfile
    restart: unless-stopped
    environment:
      ORWELL_INDEX_DB: /data/index.sqlite
      ORWELL_EVENTS_DIR: /events
      ORWELL_CONFIG: /app/config/orwell.yaml
      ORWELL_DEVICE_ID: ${ORWELL_DEVICE_ID:-}  # MAC do host; setado pelo provisioning em .env
    volumes:
      - ${ORWELL_DATA_DIR:-./data}:/data
      - ${ORWELL_EVENTS_DIR:-./events}:/events:ro
      - ./config:/app/config:ro

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    depends_on: [clip-api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── recorder: SÓ no Jetson (precisa de GStreamer/NVIDIA + câmeras GMSL). ──
  # Suba com:  docker compose --profile jetson up -d
  recorder:
    profiles: ["jetson"]
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    runtime: nvidia               # NVIDIA Container Runtime
    privileged: true              # acesso às câmeras GMSL/Argus
    ipc: host
    environment:
      ORWELL_CONFIG: /app/config/orwell.yaml
      ORWELL_INDEX_DB: /data/index.sqlite
      ORWELL_RETENTION__DATA_DIR: /data
      ORWELL_RETENTION__EVENTS_DIR: /events
    volumes:
      - ${ORWELL_DATA_DIR:-./data}:/data
      - ${ORWELL_EVENTS_DIR:-./events}:/events
      - ./config:/app/config:ro
      - /tmp/argus_socket:/tmp/argus_socket   # daemon Argus do host
      - /dev/shm:/dev/shm                     # tmpfs compartilhado host↔container
    devices:
      - /dev/video0:/dev/video0
      # adicione mais conforme as câmeras: /dev/video1, etc.
    depends_on:
      - preview

  # ── preview: MediaMTX recebe RTSP do recorder e expõe HLS/WebRTC. ──
  # Serviço base leve; o recorder publica nele quando o profile jetson está ativo.
  # No Mac (via Tailscale):  VLC -> rtsp://orwell-nx:8554/cam0  |  WebRTC -> http://orwell-nx:8889/cam0
  preview:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
